# Build every folder with a Dockerfile on each push to main and publish it as
# ghcr.io/<owner>/agent-<folder>. Tags are UTC build time then the commit
# (20261029T120000-abc1234), so Flux's ImagePolicy picks the newest by timestamp.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.find.outputs.agents }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: echo "agents=$(ls -d */Dockerfile | cut -d/ -f1 | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
      - id: tag
        run: echo "tag=$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    # Native arm64: the cluster nodes are all arm64.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.agents) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.agent }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agent-${{ matrix.agent }}:${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.agent }}
          cache-to: type=gha,mode=max,scope=${{ matrix.agent }}
